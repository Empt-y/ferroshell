# Ferroshell configuration.
# The shell reloads this file automatically when you save it. If it contains an error,
# the shell keeps running with the last configuration that worked and shows a warning
# badge on the panel; see %LOCALAPPDATA%\ferroshell\logs\shell.*.log for details.

version = 1

# A folder name under %APPDATA%\ferroshell\themes, or a built-in theme:
# "breeze-dark", "breeze-light".
theme = "breeze-dark"

[[panel]]
# "primary", "all", or a monitor number starting at 0.
monitor = "all"
# "bottom", "top", "left" or "right".
edge = "bottom"
# Height (or width, for left/right panels) in logical pixels.
thickness = 44
# Detach the panel from the screen edge, with rounded corners.
floating = false

# Widgets, in order. Each entry is a widget id plus that widget's own settings.
# Put your own widgets in %APPDATA%\ferroshell\widgets\<id>\ to add new ones or
# override built-in ones.
widgets = [
    { id = "org.ferroshell.launcher-button" },
    { id = "org.ferroshell.taskmanager" },
    { id = "org.ferroshell.systemtray" },
    { id = "org.ferroshell.volume" },
    { id = "org.ferroshell.network" },
    { id = "org.ferroshell.bluetooth" },
    { id = "org.ferroshell.battery" },
    { id = "org.ferroshell.clock", format = "%H:%M", date-format = "%d/%m/%Y" },
    { id = "org.ferroshell.show-desktop" },
]

# The application launcher (start menu). All keys are optional.
[launcher]
# A lone Windows-key press opens this launcher instead of the Windows Start menu.
windows-key = true
# Size in logical pixels.
width = 640
height = 620
show-recent = true
# Any of "lock", "sleep", "restart", "shutdown", "logout".
power-actions = ["lock", "sleep", "restart", "shutdown", "logout"]
# Right-click an app in the launcher and choose "Add to favourites" to fill this.
favourites = []
# Optional web search as the last result, e.g. "https://duckduckgo.com/?q={}".
web-search = ""
# Only used when Ferroshell is your login shell (packaging/shell/enable-login-shell.ps1).
[session]
# Start the apps Windows starts at sign-in (Run keys, Startup folders), honouring the
# ones you've turned off in Task Manager's Startup apps.
startup-apps = true
# Also start Store apps' startup tasks (e.g. Windows Terminal, Spotify).
startup-tasks = true
# Seconds to wait after the desktop is up.
startup-delay = 2
# Names to skip: a Run entry, a Startup-folder file, or a package family name.
startup-exclude = []

# Windows' lock screen stays Windows' own; this only sets its picture.
[lock-screen]
# Use the desktop wallpaper as the lock screen picture (and follow it when it changes).
sync-image = false
