# Fluent Light: Windows 11 in light mode.
# Copy this folder to %APPDATA%\ferroshell\themes\<name>\ to change it, and set
# `theme = "<name>"` in config.toml (or pick it in Ferroshell settings). Any token left out
# keeps its default; see docs/theming.md for what each one does.

name = "Fluent Light"
# "acrylic", "mica" or "none".
backdrop = "mica"
font = "Segoe UI Variable Text"

[colors]
panel-background = "#f3f3f3d9"
panel-border = "#0000000f"
foreground = "#1b1b1b"
foreground-dim = "#5d5d5d"
accent = "system"
hover = "#0000000a"
pressed = "#00000006"
highlight = "#0000000f"
attention = "#9d5d00"
popup-background = "#f9f9f9f2"
error = "#c42b1c"
accent-foreground = "#ffffff"
indicator = "#005fb8"
popup-border = "#0000001a"
shadow = "#00000040"
glow = "#005fb855"

[metrics]
radius = 5
panel-radius = 8
popup-radius = 8
shadow-blur = 24
indicator-size = 3

[style]
# indicator-style: line, dot, pill, glow, none
# hover-effect: fill, lift, glow, underline
# open-animation: slide, fade, zoom, none
indicator-style = "pill"
hover-effect = "fill"
open-animation = "slide"
