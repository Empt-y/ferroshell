# Catppuccin Mocha: Soothing pastels on a deep mocha base (catppuccin.com).
# Copy this folder to %APPDATA%\ferroshell\themes\<name>\ to change it, and set
# `theme = "<name>"` in config.toml (or pick it in Ferroshell settings). Any token left out
# keeps its default; see docs/theming.md for what each one does.

name = "Catppuccin Mocha"
# "acrylic", "mica" or "none".
backdrop = "acrylic"
font = ""

[colors]
panel-background = "#1e1e2ed9"
panel-border = "#313244"
foreground = "#cdd6f4"
foreground-dim = "#a6adc8"
accent = "#cba6f7"
hover = "#313244b0"
pressed = "#45475ab0"
highlight = "#cba6f733"
attention = "#fab387"
popup-background = "#1e1e2ef5"
error = "#f38ba8"
accent-foreground = "#1e1e2e"
indicator = "#cba6f7"
popup-border = "#45475a"
shadow = "#11111b99"
glow = "#cba6f766"

[metrics]
radius = 8
panel-radius = 14
popup-radius = 16
floating-margin = 8
shadow-blur = 24
indicator-size = 3
icon-size = 24

[style]
# indicator-style: line, dot, pill, glow, none
# hover-effect: fill, lift, glow, underline
# open-animation: slide, fade, zoom, none
indicator-style = "pill"
hover-effect = "lift"
open-animation = "zoom"
