# Breeze Dark: KDE Plasma's default dark look (the built-in defaults, spelled out).
# Copy this folder to %APPDATA%\ferroshell\themes\<name>\ to change it, and set
# `theme = "<name>"` in config.toml (or pick it in Ferroshell settings). Any token left out
# keeps its default; see docs/theming.md for what each one does.

name = "Breeze Dark"
# "acrylic", "mica" or "none".
backdrop = "acrylic"
font = ""

[colors]
panel-background = "#202326cc"
panel-border = "#ffffff14"
foreground = "#fcfcfc"
foreground-dim = "#a1a9b1"
accent = "#3daee9"
hover = "#ffffff14"
pressed = "#ffffff24"
highlight = "#3daee940"
attention = "#f67400"
popup-background = "#202326f5"
error = "#da4453"
accent-foreground = "#ffffff"
indicator = "#3daee9"
popup-border = "#ffffff1a"
shadow = "#00000066"
glow = "#3daee980"

[metrics]
radius = 4
panel-radius = 8
floating-margin = 6
spacing = 2
padding = 3
font-size = 13
icon-size = 24
popup-radius = 10
border-width = 1
shadow-blur = 16
indicator-size = 2
animation-speed = 1

[style]
# indicator-style: line, dot, pill, glow, none
# hover-effect: fill, lift, glow, underline
# open-animation: slide, fade, zoom, none
indicator-style = "line"
hover-effect = "fill"
open-animation = "slide"
