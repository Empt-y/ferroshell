# Nord: Arctic, north-bluish calm (nordtheme.com).
# Copy this folder to %APPDATA%\ferroshell\themes\<name>\ to change it, and set
# `theme = "<name>"` in config.toml (or pick it in Ferroshell settings). Any token left out
# keeps its default; see docs/theming.md for what each one does.

name = "Nord"
# "acrylic", "mica" or "none".
backdrop = "acrylic"
font = ""

[colors]
panel-background = "#2e3440d9"
panel-border = "#4c566a66"
foreground = "#eceff4"
foreground-dim = "#a3acbd"
accent = "#88c0d0"
hover = "#4c566a66"
pressed = "#4c566aa0"
highlight = "#88c0d040"
attention = "#ebcb8b"
popup-background = "#3b4252f5"
error = "#bf616a"
accent-foreground = "#2e3440"
indicator = "#88c0d0"
popup-border = "#4c566a"
shadow = "#1d212880"
glow = "#88c0d066"

[metrics]
radius = 6
panel-radius = 10
popup-radius = 12
floating-margin = 8
shadow-blur = 20
indicator-size = 2

[style]
# indicator-style: line, dot, pill, glow, none
# hover-effect: fill, lift, glow, underline
# open-animation: slide, fade, zoom, none
indicator-style = "dot"
hover-effect = "fill"
open-animation = "slide"
