# Catppuccin Latte: Catppuccin's light flavour.
# Copy this folder to %APPDATA%\ferroshell\themes\<name>\ to change it, and set
# `theme = "<name>"` in config.toml (or pick it in Ferroshell settings). Any token left out
# keeps its default; see docs/theming.md for what each one does.

name = "Catppuccin Latte"
# "acrylic", "mica" or "none".
backdrop = "acrylic"
font = ""

[colors]
panel-background = "#eff1f5e0"
panel-border = "#ccd0da"
foreground = "#4c4f69"
foreground-dim = "#6c6f85"
accent = "#8839ef"
hover = "#ccd0dab0"
pressed = "#bcc0ccb0"
highlight = "#8839ef26"
attention = "#fe640b"
popup-background = "#eff1f5f5"
error = "#d20f39"
accent-foreground = "#eff1f5"
indicator = "#8839ef"
popup-border = "#ccd0da"
shadow = "#4c4f6940"
glow = "#8839ef55"

[metrics]
radius = 8
panel-radius = 14
popup-radius = 16
floating-margin = 8
shadow-blur = 20
indicator-size = 3

[style]
# indicator-style: line, dot, pill, glow, none
# hover-effect: fill, lift, glow, underline
# open-animation: slide, fade, zoom, none
indicator-style = "pill"
hover-effect = "lift"
open-animation = "zoom"
