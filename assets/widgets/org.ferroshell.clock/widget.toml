id = "org.ferroshell.clock"
name = "Digital Clock"
description = "Time and date. Click for a calendar."
version = "1.1.0"
api = 1

[popup]
file = "popup.slint"
width = 330
height = 400

[config.format]
type = "string"
default = "%H:%M"
label = "Time format"
description = "strftime-style, e.g. %H:%M, %I:%M %p, %H:%M:%S"

[config.date-format]
type = "string"
default = "%d/%m/%Y"
label = "Date format"

[config.show-date]
type = "bool"
default = true
label = "Show date"
description = "Shown below the time when the panel is thick enough."

[config.first-day]
type = "enum"
default = "monday"
options = ["monday", "sunday"]
scope = "popup"
label = "Calendar: first day of the week"

[config.week-numbers]
type = "bool"
default = true
scope = "popup"
label = "Calendar: show week numbers"
