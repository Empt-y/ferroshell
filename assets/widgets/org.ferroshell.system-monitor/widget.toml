id = "org.ferroshell.system-monitor"
name = "System Monitor"
description = "CPU and memory usage. Click to open Task Manager."
version = "1.0.0"
api = 1

[plugin]
exec = "${EXE_DIR}\\fsh-sysmon.exe"
max-memory-mb = 64

[config.show-text]
type = "bool"
default = true
label = "Show percentages"

[config.warn-at]
type = "int"
default = 90
min = 1
max = 100
label = "Highlight above (%)"
