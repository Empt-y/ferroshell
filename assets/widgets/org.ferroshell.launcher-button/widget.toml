id = "org.ferroshell.launcher-button"
name = "Application Launcher Button"
description = "Opens the application launcher."
version = "1.1.0"
api = 1

[config.action]
type = "enum"
default = "launcher"
options = ["launcher", "start-menu"]
label = "Opens"
description = "\"launcher\" is Ferroshell's; \"start-menu\" is the Windows Start menu."
